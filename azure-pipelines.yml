name: $(Date:yyyyMMdd)$(Rev:.r)

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm

trigger:
  - master
  - InDev

strategy:
  matrix:
    linux:
      imageName: 'ubuntu-latest'
    mac:
      imageName: 'macOS-latest'
    windows:
      imageName: 'windows-latest'

pool:
  vmImage: $(imageName)

steps:
- task: UseNode@1
  inputs:
    version: 22.x
    checkLatest: false
- task: Cache@2
  inputs:
    key: 'npm | "$(Agent.OS)" | "22.x" | **/package.json'
    restoreKeys: |
      npm | "$(Agent.OS)" | "22.x"
    path: $(npm_config_cache)
  displayName: 'Cache npm'
- powershell: |
    npm install -g typescript jest typedoc rimraf
  displayName: 'Install Globals'
  failOnStderr: false
- powershell: |
    npm install --silent
    npm run build
  displayName: 'Build Library'
  failOnStderr: true
- script: npm run lint
  displayName: 'Run Lint'
  failOnStderr: true
- powershell: |
    npm run doc
  displayName: 'Run Type Doc'
  failOnStderr: true
- powershell: |
    cd tests/unittests
    npm install --silent
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    npm run test
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  displayName: 'Run Unit Tests'
  # Jest writes its summary to stderr, so failOnStderr would fail passing runs.
  # Failure is determined by the exit codes checked above instead.
  failOnStderr: false
- powershell: |
    cd tests/nodetest
    npm install --silent
    tsc
    node index.js
  displayName: 'Test Node'
  failOnStderr: true
- powershell: |
    cd tests/reacttest
    npm install --silent
    npm run build
  displayName: 'Test React'
  failOnStderr: true
- powershell: |
    cd tests/moduletest
    npm install --silent
    tsc
    node index.js
  displayName: 'Test Modules'
  failOnStderr: true
- powershell: |
    cd tests/esmtest
    npm install --silent
    tsc
    node index.js
  displayName: 'Test ESM Modules'
  failOnStderr: true
- powershell: |
    cd examples
    npm install --silent
    npm run test
  displayName: 'Test Examples'
  failOnStderr: true